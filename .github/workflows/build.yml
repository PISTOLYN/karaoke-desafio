name: Compilar y Publicar Juego

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# ESTO ES LO QUE FALTABA: Permiso explícito para crear Releases
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Descargar el código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Compilar con PyInstaller
      run: |
        pyinstaller --onefile --windowed --add-data "assets;assets" --name "KaraokeDesafio" karaoke_game.py

    - name: Empaquetar el Juego con sus carpetas
      shell: powershell # Forzamos PowerShell para que Compress-Archive funcione bien
      run: |
        New-Item -ItemType Directory -Force -Path "Entrega"
        Copy-Item -Path "dist\KaraokeDesafio.exe" -Destination "Entrega\"
        Copy-Item -Path "assets" -Destination "Entrega\assets" -Recurse -Force
        New-Item -ItemType Directory -Force -Path "Entrega\pistas"
        New-Item -ItemType Directory -Force -Path "Entrega\textos_alexa"
        Compress-Archive -Path "Entrega\*" -DestinationPath "KaraokeDesafio-Completo.zip" -Force

    - name: Publicar en Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Karaoke Desafío ${{ github.run_number }}
        files: KaraokeDesafio-Completo.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
