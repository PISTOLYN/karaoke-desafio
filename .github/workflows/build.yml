name: Compilar EXE (Windows)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Asegurar carpeta assets
        run: New-Item -ItemType Directory -Force assets | Out-Null

      - name: Compilar con PyInstaller
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name KaraokeDesafio
          --add-data "assets;assets"
          --collect-all edge_tts
          --hidden-import pyttsx3.drivers
          --hidden-import pyttsx3.drivers.sapi5
          karaoke_game.py

      - name: Subir EXE como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: KaraokeDesafio-Windows
          path: dist/KaraokeDesafio.exe

      - name: Publicar release (solo con tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KaraokeDesafio.exe
